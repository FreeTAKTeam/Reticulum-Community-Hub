name: Rust workspace

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  LXMF_REF: 9b972f9a8d3a7949eae89bc78f7a9691f06f3ed1

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Check out RCH
        uses: actions/checkout@v6
        with:
          path: rch

      - name: Check out matching LXMF-rs
        uses: actions/checkout@v6
        with:
          repository: FreeTAKTeam/LXMF-rs
          path: LXMF-rs
          ref: ${{ env.LXMF_REF }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Run release readiness gates
        shell: pwsh
        working-directory: rch
        run: ./scripts/release-readiness.ps1 -ServerOnlyAlpha
