name: LXMF main compatibility

on:
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RCH
        uses: actions/checkout@v6
        with:
          path: rch

      - name: Check out current LXMF main
        uses: actions/checkout@v6
        with:
          repository: FreeTAKTeam/LXMF-rs
          ref: main
          path: LXMF-rs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy

      - name: Allow sibling main versions only in this compatibility build
        shell: pwsh
        working-directory: rch
        run: |
          $baseline = Get-Content -LiteralPath config/lxmf-runtime-baseline.json -Raw | ConvertFrom-Json
          $releasedVersion = 'version = "=?' + [regex]::Escape($baseline.sdk_version) + '"'
          $releasedSource = 'git = "https://github.com/FreeTAKTeam/LXMF-rs.git", rev = "[a-f0-9]{40}"'
          # All LXMF-rs crates are pinned once in the workspace manifest.
          $siblingPaths = [ordered]@{
            'rns-core' = 'rns-core'
            'rns-rpc'  = 'rns-rpc'
            'lxmf'     = 'lxmf-core'
            'lxmf-sdk' = 'lxmf-sdk'
          }
          $workspaceManifest = Get-Content -LiteralPath Cargo.toml -Raw
          $workspaceManifest = $workspaceManifest -replace $releasedVersion, 'version = "*"'
          foreach ($dependency in $siblingPaths.Keys) {
            $pattern = '(?m)^(' + [regex]::Escape($dependency) + ' = .*?)' + $releasedSource
            if ($workspaceManifest -notmatch $pattern) {
              throw "Workspace manifest has no pinned LXMF-rs source for $dependency"
            }
            $workspaceManifest = $workspaceManifest -replace $pattern, ('$1path = "../LXMF-rs/crates/libs/' + $siblingPaths[$dependency] + '"')
          }
          Set-Content -LiteralPath Cargo.toml -Value $workspaceManifest -Encoding utf8
          cargo update -p lxmf-wire -p lxmf-sdk -p reticulum-rs-rpc -p reticulum-rs-core
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not update the compatibility build to sibling LXMF main'
          }

      - name: Prove sibling sources are selected
        shell: pwsh
        working-directory: rch
        run: |
          $tree = cargo tree -p r3akt-transport-rns
          $tree
          if (($tree | Select-String -SimpleMatch '/LXMF-rs/crates/libs/').Count -lt 4) {
            throw 'Compatibility build did not resolve all LXMF dependencies from the sibling checkout'
          }

      - name: Check current LXMF main without changing production lockfile
        working-directory: rch
        run: cargo check -p r3akt-transport-rns -p r3akt-rch-server --all-targets
