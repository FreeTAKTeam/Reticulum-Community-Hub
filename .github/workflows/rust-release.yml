name: Build Rust Release Packages

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version label to embed in manually built artifacts (blank uses the branch name)"
        required: false
        default: ""
      linux_amd64_only:
        description: "Build only the Linux AMD64 server package"
        type: boolean
        required: false
        default: false
  release:
    types: [published]

permissions:
  contents: write

env:
  LXMF_REF: 6782e899ff3feebf221397517dca8525a5c70661
  RUSTUP_TOOLCHAIN: "1.88"

jobs:
  server-package:
    name: Full server package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            (inputs.linux_amd64_only || contains(github.event.release.body, '<!-- rch-release: linux-amd64-only -->')) &&
            '[{"platform":"Linux AMD64","os":"ubuntu-latest","artifact":"rch-rust-full-linux-amd64","archive_format":"tar.gz","server_binary":"dist/debian-build/bin/r3akt-rch-server","tak_binary":"dist/debian-build/bin/r3akt-tak-service","reticulumd_binary":"dist/debian-build/bin/reticulumd"}]' ||
            '[{"platform":"Windows x64","os":"windows-latest","artifact":"rch-rust-full-windows-x64","archive_format":"zip","server_binary":"target/release/r3akt-rch-server.exe","tak_binary":"target/release/r3akt-tak-service.exe","reticulumd_binary":"../LXMF-rs/target/release/reticulumd.exe"},
              {"platform":"macOS x64","os":"macos-15-intel","artifact":"rch-rust-full-macos-x64","archive_format":"tar.gz","server_binary":"target/release/r3akt-rch-server","tak_binary":"target/release/r3akt-tak-service","reticulumd_binary":"../LXMF-rs/target/release/reticulumd"},
              {"platform":"macOS arm64","os":"macos-latest","artifact":"rch-rust-full-macos-arm64","archive_format":"tar.gz","server_binary":"target/release/r3akt-rch-server","tak_binary":"target/release/r3akt-tak-service","reticulumd_binary":"../LXMF-rs/target/release/reticulumd"},
              {"platform":"Linux AMD64","os":"ubuntu-latest","artifact":"rch-rust-full-linux-amd64","archive_format":"tar.gz","server_binary":"dist/debian-build/bin/r3akt-rch-server","tak_binary":"dist/debian-build/bin/r3akt-tak-service","reticulumd_binary":"dist/debian-build/bin/reticulumd"},
              {"platform":"Linux Raspberry Pi 64","os":"ubuntu-24.04-arm","artifact":"rch-rust-full-linux-rpi64","archive_format":"tar.gz","server_binary":"target/release/r3akt-rch-server","tak_binary":"target/release/r3akt-tak-service","reticulumd_binary":"../LXMF-rs/target/release/reticulumd"}]'
          ) }}

    steps:
      - name: Check out RCH
        uses: actions/checkout@v6
        with:
          path: rch

      - name: Check out LXMF-rs
        uses: actions/checkout@v6
        with:
          repository: FreeTAKTeam/LXMF-rs
          path: LXMF-rs
          ref: ${{ env.LXMF_REF }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rch/ui/package-lock.json

      - name: Install Linux reticulumd dependencies
        if: runner.os == 'Linux' && matrix.platform != 'Linux AMD64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install UI dependencies
        working-directory: rch
        run: npm --prefix ui ci

      - name: Build UI
        working-directory: rch
        run: |
          npm --prefix ui run lint
          npm --prefix ui run typecheck
          npm --prefix ui run test
          npm --prefix ui run build

      - name: Build server and TAK service
        if: matrix.platform != 'Linux AMD64'
        working-directory: rch
        run: |
          cargo build --locked --release -p r3akt-rch-server
          cargo build --locked --release -p r3akt-tak-connector --bin r3akt-tak-service

      - name: Apply matching daemon security dependency
        shell: pwsh
        working-directory: LXMF-rs
        run: |
          $baseline = Get-Content ../rch/config/lxmf-runtime-baseline.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($baseline.daemon_tokio_version)) {
            throw "The paired daemon Tokio security version is required."
          }
          cargo update -p tokio --precise $baseline.daemon_tokio_version
          if ($LASTEXITCODE -ne 0) { throw "Failed to apply the paired daemon Tokio security update." }

      - name: Build matching ZMQ-capable reticulumd
        if: matrix.platform != 'Linux AMD64'
        working-directory: LXMF-rs
        run: cargo build --release -p reticulumd --features zmq-pipeline-rpc --locked

      - name: Build Debian 12 compatible AMD64 binaries
        if: matrix.platform == 'Linux AMD64'
        working-directory: rch
        run: scripts/build-debian-release.sh ../LXMF-rs dist/debian-build

      - name: Record LXMF release commit
        id: lxmf
        shell: pwsh
        working-directory: LXMF-rs
        run: |
          "commit=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve release package name
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($version) -and "${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.release_version }}"
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to resolve release version for package naming."
          }
          $safeVersion = $version -replace '[^0-9A-Za-z._+-]', '-'
          "release_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_name=${{ matrix.artifact }}-$safeVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($version -match '^v?(\d+\.\d+\.\d+)(?:-([0-9A-Za-z.+-]+))?$') {
            $debianVersion = $Matches[1]
            if ($Matches[2]) { $debianVersion += "~$($Matches[2])" }
            "debian_version=$debianVersion-1" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Assemble full server package
        shell: pwsh
        working-directory: rch
        run: |
          ./scripts/build-rust-release-package.ps1 `
            -PackageName "${{ steps.package.outputs.package_name }}" `
            -ReleaseVersion "${{ steps.package.outputs.release_version }}" `
            -OutputDir dist `
            -ServerBinaryPath "${{ matrix.server_binary }}" `
            -TakServiceBinaryPath "${{ matrix.tak_binary }}" `
            -ReticulumdBinaryPath "${{ matrix.reticulumd_binary }}" `
            -LxmfCommit "${{ steps.lxmf.outputs.commit }}" `
            -IncludeTakService `
            -IncludeUi `
            -ArchiveFormat "${{ matrix.archive_format }}"

      - name: Assemble Debian server package
        if: matrix.platform == 'Linux AMD64' && steps.package.outputs.debian_version != ''
        working-directory: rch
        env:
          DEBIAN_VERSION: ${{ steps.package.outputs.debian_version }}
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/work/rch:ro" -v "$PWD/dist:/output" -w /work/rch \
            rch-debian-builder scripts/build-debian-package.sh \
            "/output/$PACKAGE_NAME" "$DEBIAN_VERSION" /output
          scripts/test-debian-package.sh "dist/rch-server_${DEBIAN_VERSION//\~/.}_amd64.deb"

      - name: Upload Debian package artifact
        if: github.event_name != 'release' && matrix.platform == 'Linux AMD64' && steps.package.outputs.debian_version != ''
        uses: actions/upload-artifact@v4
        with:
          name: rch-server-debian-amd64
          path: rch/dist/rch-server_*.deb*
          if-no-files-found: error

      - name: Attach Debian package to GitHub release
        if: github.event_name == 'release' && matrix.platform == 'Linux AMD64' && steps.package.outputs.debian_version != ''
        uses: softprops/action-gh-release@v2
        with:
          files: rch/dist/rch-server_*.deb*
          fail_on_unmatched_files: true

      - name: Upload server package artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: |
            rch/dist/${{ steps.package.outputs.package_name }}.*
          if-no-files-found: error

      - name: Attach server package to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rch/dist/${{ steps.package.outputs.package_name }}.*
          fail_on_unmatched_files: true

  desktop-package:
    if: >-
      ${{ !(inputs.linux_amd64_only || contains(github.event.release.body, '<!-- rch-release: linux-amd64-only -->')) }}
    name: Desktop package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64 NSIS
            os: windows-latest
            artifact: rch-desktop-windows-x64-nsis
            bundle_glob: apps/rch-desktop/src-tauri/target/release/bundle/nsis/*.exe
          - platform: Linux x64 AppImage
            os: ubuntu-latest
            artifact: rch-desktop-linux-x64-appimage
            bundle_glob: apps/rch-desktop/src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - name: Check out RCH
        uses: actions/checkout@v6
        with:
          path: rch

      - name: Check out LXMF-rs
        uses: actions/checkout@v6
        with:
          repository: FreeTAKTeam/LXMF-rs
          path: LXMF-rs
          ref: ${{ env.LXMF_REF }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            rch/ui/package-lock.json
            rch/apps/rch-desktop/package-lock.json

      - name: Install Linux desktop packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libxdo-dev \
            pkg-config \
            librsvg2-dev \
            patchelf \
            wget

      - name: Install UI dependencies
        working-directory: rch
        run: npm --prefix ui ci

      - name: Install desktop dependencies
        working-directory: rch
        run: npm --prefix apps/rch-desktop ci

      - name: Build Tauri desktop package
        working-directory: rch
        run: |
          npm --prefix ui run lint
          npm --prefix ui run typecheck
          npm --prefix ui run test
          npm --prefix apps/rch-desktop run build

      - name: Stage desktop package files
        shell: pwsh
        working-directory: rch
        run: |
          $dist = "dist/desktop/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $files = Get-ChildItem -Path "${{ matrix.bundle_glob }}"
          if (-not $files) {
            throw "No desktop artifacts matched ${{ matrix.bundle_glob }}"
          }
          foreach ($file in $files) {
            # GitHub replaces spaces in uploaded release asset names with dots.
            # Normalize before hashing so a downloaded asset can be verified by
            # its adjacent checksum file without manually renaming it.
            $assetName = $file.Name -replace '\s+', '.'
            $destination = Join-Path $dist $assetName
            Copy-Item -LiteralPath $file.FullName -Destination $destination -Force
          }
          Get-ChildItem -LiteralPath $dist -File | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Set-Content -LiteralPath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload desktop package artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            rch/dist/desktop/${{ matrix.artifact }}/*
          if-no-files-found: error

      - name: Attach desktop package to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rch/dist/desktop/${{ matrix.artifact }}/*
          fail_on_unmatched_files: true
