[server]
bind = 127.0.0.1:8000
db_path = ./rch_state.sqlite3
ui_dist_path =

[hub]
display_name = RCH
identity_path = identity
announce_interval = 300

[security]
api_key_env = RTH_API_KEY

[reticulumd]
rpc_endpoint =
lxmf_zmq_command = tcp://localhost:9100
lxmf_zmq_response = tcp://localhost:9101

# Identity directory policy (also overridable with RCH_IDENTITY_<KEY>).
[identity_directory]
page_size = 50
recent_hours = 24
lookup_max_entries = 500
lookup_concurrency = 4
