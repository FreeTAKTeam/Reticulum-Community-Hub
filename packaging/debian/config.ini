[server]
bind = 127.0.0.1:8000
db_path = /var/lib/rch/rch_state.sqlite3
ui_dist_path = /opt/rch/ui

[hub]
display_name = RCH
identity_path = /var/lib/rch/identity
announce_interval = 300

[security]
api_key_env = RTH_API_KEY

[reticulumd]
lxmf_zmq_command = tcp://127.0.0.1:9100
lxmf_zmq_response = tcp://127.0.0.1:9101
